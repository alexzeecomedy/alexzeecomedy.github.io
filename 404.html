<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>404 - Not Found | Alex Zee Comedy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--hacker-black, #0a0a0a);
        color: var(--neon-green, #2ecc40);
        font-family: "JetBrains Mono", "Ubuntu Mono", monospace;
      }
      .notfound-container {
        background: var(--hacker-gray, #2a2a2a);
        border: 2px solid var(--neon-green, #2ecc40);
        border-radius: 8px;
        padding: 2.5rem 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        text-align: center;
        max-width: 500px;
      }
      .notfound-container h1 {
        font-size: 3rem;
        margin-bottom: 0.5em;
        color: var(--neon-green, #2ecc40);
      }
      .notfound-container p {
        color: var(--terminal-green, #00bfae);
        margin-bottom: 1.5em;
        font-size: 1.2rem;
      }
      .notfound-container a {
        color: var(--cyber-blue, #0084ff);
        border-bottom: 1px dotted var(--cyber-blue, #0084ff);
        text-decoration: none;
        transition: color 0.2s, border-bottom-color 0.2s;
      }
      .notfound-container a:hover {
        color: var(--neon-green, #2ecc40);
        border-bottom-color: var(--neon-green, #2ecc40);
      }
      .ascii-art {
        color: var(--warning-amber, #ffb700);
        font-size: 1.1rem;
        margin-bottom: 1.5em;
        font-family: "JetBrains Mono", "Ubuntu Mono", monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <main class="notfound-container h-entry">
      <h1 class="p-name">404</h1>
      <div class="ascii-art" aria-hidden="true">{ 404 } \ (╯°□°）╯︵ ┻━┻</div>
      <p class="p-summary">
        Yoink! The page you’re looking for does not exist.<br />
        Maybe the page you're looking for is the friends we made along the way.
      </p>
      <p>
        <a class="u-url" href="/">Return to Home</a> |
        <a href="https://alexzeecomedy.com/pages/about">About</a> |
        <a href="https://alexzeecomedy.com/pages/contact">Contact</a>
      </p>
      <p
        style="
          margin-top: 2em;
          color: var(--text-secondary, #b3b3b3);
          font-size: 0.95em;
        "
      >
        If you think this is a bug,
        <a
          href="https://github.com/alexzeecomedy/alexzeecomedy.github.io/issues"
          >let me know</a
        >.
      </p>
    </main>
  </body>
</html>
